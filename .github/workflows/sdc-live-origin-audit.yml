name: Read-only SDC live origin audit
on:
  push:
    branches: ['sdc/audit-live-origin-20260922']
    paths: ['.github/workflows/sdc-live-origin-audit.yml']
permissions: {}
concurrency:
  group: sdc-public-page-comparison
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare read-only browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Open homepage and restaurant in both versions
        shell: python
        run: |
          import asyncio, json, re, hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen
          from playwright.async_api import async_playwright
          out=Path('comparison'); out.mkdir(exist_ok=True)
          urls=[('live-home','https://structuredecuisine.ca/'),('live-restaurant','https://structuredecuisine.ca/restaurant'),('github-home','https://maximeleveuglesdc.github.io/'),('github-restaurant','https://maximeleveuglesdc.github.io/restaurant')]
          reports=[]
          async def main():
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch()
                  async def inspect(label,url):
                      context=await browser.new_context(viewport={'width':1440,'height':1000},device_scale_factor=1)
                      page=await context.new_page();errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)[:300]))
                      async def protect(route):
                          u=route.request.url
                          if any(k in u for k in ['goatcounter.com','gc.zgo.at','google-analytics.com','googletagmanager.com','connect.facebook.net','facebook.com/tr','analytics.google.com']):await route.abort()
                          else:await route.continue_()
                      await page.route('**/*',protect)
                      record={'label':label,'requested_url':url}
                      try:
                          response=await page.goto(url,wait_until='domcontentloaded',timeout=45000)
                          try:await page.locator('h1').first.wait_for(timeout=15000)
                          except Exception:pass
                          await page.wait_for_timeout(1800)
                          record.update(await page.evaluate('''() => ({
                              title:document.title,url:location.href,
                              h1:[...document.querySelectorAll('h1')].map(x=>x.innerText),
                              headings:[...document.querySelectorAll('h2')].map(x=>x.innerText),
                              nav:[...document.querySelectorAll('nav a,nav button')].map(x=>({text:x.innerText,href:x.getAttribute('href')})),
                              text:document.body.innerText,
                              scripts:[...document.scripts].map(x=>x.src).filter(Boolean),
                              images:[...document.images].map(x=>({src:x.getAttribute('src'),alt:x.alt,ok:x.complete&&x.naturalWidth>0})),
                              preview:(document.querySelector('#system-preview')||{}).innerText||null,
                              previewLinks:[...document.querySelectorAll('#system-preview a')].map(x=>({text:x.innerText,href:x.href})),
                              robots:document.querySelector('meta[name="robots"]')?.content
                          })'''))
                          record['http']=response.status if response else None
                          await page.screenshot(path=str(out/(label+'.jpg')),full_page=True,type='jpeg',quality=75,animations='disabled')
                      except Exception as e:record['error']=str(e)[:400]
                      record['browser_errors']=errors
                      reports.append(record)
                      printable={k:v for k,v in record.items() if k not in ['text','images','nav','preview']}
                      printable['nav_text']=[x['text'] for x in record.get('nav',[])][:20]
                      printable['team_names_present']=[n for n in ['Davis Furlong','Vincent Pizzini','Guillaume','Maxime'] if n in record.get('text','')]
                      printable['preview_excerpt']=(record.get('preview') or '')[:2400]
                      printable['preview_images']=[x for x in record.get('images',[]) if 'system-previews' in x['src']]
                      print('BROWSER_PAGE',json.dumps(printable,ensure_ascii=False),flush=True)
                      await context.close()
                  await asyncio.gather(*(inspect(*u) for u in urls))
                  await browser.close()
          asyncio.run(main())
          def get(url):
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:return r.read().decode('utf-8')
          try:
              live=next(r for r in reports if r['label']=='live-home')
              main_js=next(x for x in live['scripts'] if '/sdc-static/assets/index-' in x)
              code=get(main_js)
              paths=re.findall(r'[\"\x27]([^\"\x27]*sectorPages-[^\"\x27]+\.js)[\"\x27]',code)
              path=next(x for x in paths if len(x)<150)
              live_url='https://structuredecuisine.ca/sdc-static/assets/'+path.split('/')[-1]
              old_url='https://raw.githubusercontent.com/maximeleveuglesdc/maximeleveuglesdc.github.io/main/sdc-static/assets/sectorPages-Dkeq-DYe.js'
              a,b=get(live_url),get(old_url)
              normalize=lambda x:re.sub(r'index-[A-Za-z0-9_-]+\.js','index-NORMALIZED.js',x)
              result={'live_module':live_url,'github_module':old_url,'byte_identical':a==b,'identical_except_main_import_filename':normalize(a)==normalize(b),'live_chars':len(a),'github_chars':len(b)}
              print('RESTAURANT_CODE_COMPARISON',json.dumps(result,ensure_ascii=False),flush=True)
              (out/'code-comparison.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          except Exception as e:print('CODE_COMPARISON_ERROR',type(e).__name__,str(e)[:300],flush=True)
          (out/'pages.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print('NO_APPLICATION_FILES_OR_DEPLOYMENTS_CHANGED',flush=True)
      - name: Retain public comparison captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdc-public-comparison
          path: comparison/
          retention-days: 1
